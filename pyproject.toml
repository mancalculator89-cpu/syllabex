[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syllabex-parser"
version = "0.1.0"
description = "Fidelity-first PDF syllabus extraction pipeline"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "pydantic>=2.7",
  "pillow>=10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
syllabex-parse = "syllabex_parser.cli:main"
syllabex-web = "syllabex_parser.web.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/syllabex_parser"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
