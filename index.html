<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syllabex</title>
<style>
:root{
  color-scheme:light;
  --shell:#e9e7e2;--chrome:#f4f2ee;--surface:#fffefa;--surface2:#f7f5f0;
  --ink:#171717;--muted:#77756f;--line:#d9d5ce;--line2:#c8c3ba;
  --accent:#635bff;--accent2:#8f89ff;--soft:rgba(99,91,255,.12);
  --good:#18865d;--bad:#c94a4a;--shadow:0 22px 72px rgba(48,42,33,.16);
}
body.dark{
  color-scheme:dark;
  --shell:#090b10;--chrome:#151820;--surface:#1b1f29;--surface2:#11141b;
  --ink:#f4f5f7;--muted:#979eab;--line:#2c323e;--line2:#3c4452;
  --accent:#8b84ff;--accent2:#b2adff;--soft:rgba(139,132,255,.14);
  --good:#4eca91;--bad:#ff7b7b;--shadow:0 28px 90px rgba(0,0,0,.48);
}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--shell);color:var(--ink);overflow:hidden}button,input,select{font:inherit}.hidden{display:none!important}

/* HOME */
.home{height:100%;position:relative;overflow:auto;background:radial-gradient(circle at 50% 8%,var(--soft),transparent 31%),var(--shell)}
.home-top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,5vw,76px)}
.logo{font-size:23px;font-weight:850;letter-spacing:-.045em}.logo b{color:var(--accent)}
.theme{height:38px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);padding:0 14px;cursor:pointer}
.hero{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:36px 22px 74px}
.hero-inner{width:min(820px,100%);text-align:center}
.orbit{width:152px;height:152px;margin:0 auto 30px;border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);border-radius:50%;position:relative;animation:spin 8s linear infinite}
.orbit:before{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:var(--accent);left:50%;top:4px;box-shadow:0 0 24px var(--accent)}
.paper-glyph{position:absolute;width:78px;height:102px;border:1px solid var(--line);border-radius:11px;background:var(--surface);left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:var(--shadow);padding:23px 15px}.paper-glyph i{display:block;height:6px;background:var(--line);border-radius:99px;margin:9px 0}.paper-glyph i:nth-child(2){width:78%}.paper-glyph i:nth-child(3){width:56%}@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{font-size:clamp(43px,7vw,76px);line-height:.98;letter-spacing:-.065em;margin:0 0 20px}.hero h1 span{color:var(--accent)}
.hero-copy{font-size:18px;color:var(--muted);line-height:1.65;max-width:610px;margin:0 auto 32px}
.dropzone{width:min(620px,100%);margin:auto;border:1.5px dashed color-mix(in srgb,var(--accent) 58%,var(--line));background:color-mix(in srgb,var(--surface) 88%,var(--soft));border-radius:24px;padding:30px;transition:.2s;box-shadow:0 12px 36px rgba(0,0,0,.05)}.dropzone.drag{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 18px 45px rgba(99,91,255,.18)}
.upload-main{border:0;border-radius:14px;background:var(--accent);color:white;font-weight:800;padding:14px 24px;cursor:pointer;box-shadow:0 9px 24px rgba(99,91,255,.28)}.drop-hint{display:block;color:var(--muted);font-size:13px;margin-top:11px}
.progress{display:none;height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:17px}.progress.show{display:block}.progress i{display:block;width:8%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit;transition:width .35s}
.status{display:none;margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--muted);text-align:left;font-size:14px}.status.show{display:flex;align-items:center;gap:11px}.status.error{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 48%,var(--line))}.status.success{color:var(--good);border-color:color-mix(in srgb,var(--good) 48%,var(--line))}
.spinner{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}

/* APP */
.app{height:100%;padding:10px}.browser{height:100%;background:var(--surface);border:1px solid var(--line2);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);display:grid;grid-template-rows:44px 54px 1fr}
.app-title{display:grid;place-items:center;background:var(--chrome);border-bottom:1px solid var(--line);font-weight:850;letter-spacing:-.04em}.app-title b{color:var(--accent)}
.tabbar{display:flex;align-items:end;gap:4px;background:var(--chrome);border-bottom:1px solid var(--line);padding:0 14px;min-width:0}.tabs{display:flex;align-items:end;gap:3px;flex:1;min-width:0;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.subject-tab{height:42px;width:210px;max-width:24vw;border:1px solid transparent;border-bottom:0;border-radius:13px 13px 0 0;background:color-mix(in srgb,var(--surface2) 72%,var(--line));color:var(--muted);display:flex;align-items:center;gap:10px;padding:0 12px;cursor:pointer;flex:0 1 210px}.subject-tab.active{height:46px;background:var(--surface);border-color:var(--line);color:var(--ink)}
.favicon{width:17px;height:17px;border-radius:6px;flex:none}.tab-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-theme{margin-bottom:7px}
.workspace{display:grid;grid-template-columns:248px 1fr;min-height:0}.rail{background:var(--surface2);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;min-height:0}.rail-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 16px}.rail-logo{font-size:19px;font-weight:850;letter-spacing:-.04em}.rail-logo b{color:var(--accent)}.upload-small{border:0;border-radius:10px;background:var(--accent);color:white;font-weight:750;padding:8px 11px;cursor:pointer}
.mode-nav{display:grid;gap:8px}.mode{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:13px;padding:14px 13px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;font-weight:680}.mode:hover{background:var(--surface);color:var(--ink);border-color:var(--line)}.mode.active{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:0 8px 24px rgba(0,0,0,.06)}.ico{width:31px;height:31px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}.rail-spacer{flex:1}
.viewport{position:relative;min-width:0;min-height:0}.view{position:absolute;inset:0;display:none;overflow:auto;background:linear-gradient(145deg,var(--surface),var(--surface2));padding:30px}.view.active{display:block}
.loading-view{height:100%;display:grid;place-items:center;color:var(--muted)}

/* PARSED CONTENT */
.content-head{max-width:1020px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:18px}.content-meta{color:var(--muted);font-size:13px}.doc-actions{display:flex;gap:8px}.secondary{height:38px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);padding:0 13px;cursor:pointer}
.pages{max-width:1020px;margin:auto;display:grid;gap:30px}.page-shell{background:var(--surface);border:1px solid var(--line);border-radius:23px;padding:20px;box-shadow:0 9px 34px rgba(0,0,0,.07)}.page-label{font-size:12px;color:var(--muted);margin:0 0 11px 4px}.pdf-page{position:relative;background:#fff;color:#000;box-shadow:0 12px 38px rgba(0,0,0,.16);margin:auto;overflow:hidden;transform-origin:top center}.pdf-page span{position:absolute;white-space:pre;line-height:1;transform-origin:left top}.pdf-page img{position:absolute;object-fit:contain}.content-error{max-width:720px;margin:70px auto;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--bad)}

/* OTHER VIEWS */
.mindmap{height:100%;min-height:620px;background-image:radial-gradient(var(--line) 1.15px,transparent 1.15px);background-size:24px 24px;position:relative;overflow:hidden}.canvas-tools{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:5px;padding:6px;border:1px solid var(--line);background:var(--surface);border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,.08)}.tool{height:34px;min-width:34px;border:0;border-radius:9px;background:transparent;color:var(--ink);cursor:pointer}.tool:hover{background:var(--soft)}.map-node{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:250px;min-height:112px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:18px;background:var(--surface);box-shadow:0 18px 44px rgba(99,91,255,.14);padding:17px}.skeleton{height:8px;background:var(--line);border-radius:99px;margin:12px 0}.zoom{position:absolute;left:18px;bottom:18px;display:flex;gap:4px;padding:5px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.panel{max-width:1020px;margin:auto;border:1px solid var(--line);border-radius:23px;background:var(--surface);padding:30px;box-shadow:0 8px 28px rgba(0,0,0,.06)}.panel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.choice{height:55px;border:1px solid var(--line);border-radius:13px;background:var(--surface2)}.generate-button{width:100%;height:48px;margin-top:24px;border:0;border-radius:13px;background:var(--accent);color:white;font-weight:800}.library-item{display:grid;grid-template-columns:54px 1fr 36px;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:15px;margin:10px 0}.paper-icon{width:48px;height:58px;border:1px solid var(--line);border-radius:7px;background:var(--surface2)}
@media(max-width:800px){.workspace{grid-template-columns:78px 1fr}.rail-logo,.upload-small,.mode .label{display:none}.mode{justify-content:center}.view{padding:14px}.subject-tab{width:160px}.panel-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<input id="fileInput" type="file" accept="application/pdf" hidden>

<section class="home" id="home">
  <header class="home-top"><div class="logo"><b>Sylla</b>bex</div><button class="theme" id="homeTheme">Dark Mode</button></header>
  <main class="hero"><div class="hero-inner">
    <div class="orbit"><div class="paper-glyph"><i></i><i></i><i></i></div></div>
    <h1>Your syllabus,<br><span>made usable.</span></h1>
    <p class="hero-copy">Upload a syllabus and Syllabex will validate it, parse its pages, preserve its formatting, and open the reconstructed subject content.</p>
    <div class="dropzone" id="dropzone">
      <button class="upload-main" id="homeUpload">Upload syllabus</button>
      <span class="drop-hint">PDF only · drag and drop also works</span>
      <div class="progress" id="progress"><i id="progressBar"></i></div>
      <div class="status" id="status"><span class="spinner" id="spinner"></span><span id="statusText"></span></div>
    </div>
  </div></main>
</section>

<section class="app hidden" id="app">
  <div class="browser">
    <div class="app-title"><span><b>Sylla</b>bex</span></div>
    <div class="tabbar"><div class="tabs" id="tabs"></div><button class="theme top-theme" id="appTheme">Dark Mode</button></div>
    <div class="workspace">
      <aside class="rail">
        <div class="rail-head"><div class="rail-logo"><b>Sylla</b>bex</div><button class="upload-small" id="addSyllabus">Upload</button></div>
        <nav class="mode-nav">
          <button class="mode active" data-view="content"><span class="ico">▤</span><span class="label">Subject content</span></button>
          <button class="mode" data-view="mindmap"><span class="ico">⌘</span><span class="label">Mindmap</span></button>
          <button class="mode" data-view="generate"><span class="ico">▱</span><span class="label">Generate papers</span></button>
          <button class="mode" data-view="generated"><span class="ico">▥</span><span class="label">Generated papers</span></button>
        </nav><div class="rail-spacer"></div>
      </aside>
      <main class="viewport">
        <section class="view active" id="content"><div class="loading-view">No parsed syllabus loaded.</div></section>
        <section class="view" id="mindmap"><div class="mindmap"><div class="canvas-tools"><button class="tool">+</button><button class="tool">T</button><button class="tool">▧</button><button class="tool">ƒx</button></div><article class="map-node"><div class="skeleton" style="width:42%"></div><div class="skeleton" style="width:88%"></div><div class="skeleton" style="width:61%"></div></article><div class="zoom"><button class="tool" id="zoomOut">−</button><button class="tool" id="zoomLevel">100%</button><button class="tool" id="zoomIn">+</button></div></div></section>
        <section class="view" id="generate"><div class="panel"><div class="skeleton" style="width:24%;height:12px"></div><div class="panel-grid"><div class="choice"></div><div class="choice"></div><div class="choice"></div><div class="choice"></div></div><button class="generate-button">Generate</button></div></section>
        <section class="view" id="generated"><div class="panel"><div class="library-item"><div class="paper-icon"></div><div><div class="skeleton" style="width:55%"></div><div class="skeleton" style="width:32%"></div></div><div>•••</div></div><div class="library-item"><div class="paper-icon"></div><div><div class="skeleton" style="width:68%"></div><div class="skeleton" style="width:42%"></div></div><div>•••</div></div></div></section>
      </main>
    </div>
  </div>
</section>

<script>
const API='/api/syllabi';
const home=document.getElementById('home'),app=document.getElementById('app'),fileInput=document.getElementById('fileInput'),dropzone=document.getElementById('dropzone'),statusBox=document.getElementById('status'),statusText=document.getElementById('statusText'),spinner=document.getElementById('spinner'),progress=document.getElementById('progress'),progressBar=document.getElementById('progressBar'),tabs=document.getElementById('tabs');
const subjects=[];let activeSubject=null;let zoomValue=100;

function setTheme(dark){document.body.classList.toggle('dark',dark);document.getElementById('homeTheme').textContent=dark?'Light Mode':'Dark Mode';document.getElementById('appTheme').textContent=dark?'Light Mode':'Dark Mode';try{localStorage.setItem('syllabex-theme',dark?'dark':'light')}catch(e){}}
function toggleTheme(){setTheme(!document.body.classList.contains('dark'))}
document.getElementById('homeTheme').onclick=toggleTheme;document.getElementById('appTheme').onclick=toggleTheme;try{setTheme(localStorage.getItem('syllabex-theme')==='dark')}catch(e){setTheme(false)}

function showStatus(text,type='loading',percent=15){statusBox.className='status show'+(type==='error'?' error':type==='success'?' success':'');statusText.textContent=text;spinner.style.display=type==='loading'?'block':'none';progress.classList.add('show');progressBar.style.width=percent+'%'}
function openPicker(){fileInput.click()}document.getElementById('homeUpload').onclick=openPicker;document.getElementById('addSyllabus').onclick=openPicker;
fileInput.onchange=()=>{if(fileInput.files[0])uploadAndParse(fileInput.files[0])};
['dragenter','dragover'].forEach(name=>dropzone.addEventListener(name,e=>{e.preventDefault();dropzone.classList.add('drag')}));['dragleave','drop'].forEach(name=>dropzone.addEventListener(name,e=>{e.preventDefault();dropzone.classList.remove('drag')}));dropzone.addEventListener('drop',e=>{if(e.dataTransfer.files[0])uploadAndParse(e.dataTransfer.files[0])});

async function uploadAndParse(file){
  try{
    if(!file.name.toLowerCase().endsWith('.pdf'))throw new Error('Only PDF files are accepted.');
    showStatus('Uploading syllabus…','loading',18);
    const body=new FormData();body.append('file',file);
    const response=await fetch(API,{method:'POST',body});
    showStatus('Parsing pages, fonts, images and structure…','loading',68);
    let payload={};try{payload=await response.json()}catch(e){}
    if(!response.ok){const d=payload.detail;if(typeof d==='string')throw new Error(d);const reasons=d&&d.reasons?d.reasons.join(' '):'';throw new Error((d&&d.message?d.message:'The PDF was rejected.')+' '+reasons)}
    const documentData=await fetch(payload.document_url).then(r=>{if(!r.ok)throw new Error('Parsed document could not be loaded.');return r.json()});
    const colors=['#635bff','#14b8a6','#f59e0b','#ec4899','#0ea5e9'];
    const subject={id:payload.subject_id,title:payload.title||file.name.replace(/\.pdf$/i,''),color:colors[subjects.length%colors.length],pageCount:payload.page_count,score:payload.score,document:documentData,pdfUrl:payload.source_pdf_url};
    subjects.push(subject);activeSubject=subject.id;renderTabs();renderSubject(subject);
    showStatus('Syllabus parsed successfully.','success',100);
    setTimeout(()=>{home.classList.add('hidden');app.classList.remove('hidden');},420);
  }catch(error){showStatus(error.message||'The syllabus could not be parsed.','error',100)}finally{fileInput.value=''}
}

function renderTabs(){tabs.innerHTML='';subjects.forEach(subject=>{const tab=document.createElement('button');tab.className='subject-tab'+(subject.id===activeSubject?' active':'');tab.innerHTML=`<span class="favicon" style="background:${subject.color}"></span><span class="tab-name"></span>`;tab.querySelector('.tab-name').textContent=subject.title;tab.onclick=()=>{activeSubject=subject.id;renderTabs();renderSubject(subject)};tabs.appendChild(tab)})}
function active(){return subjects.find(s=>s.id===activeSubject)}

function renderSubject(subject){
  const root=document.getElementById('content');root.innerHTML='';
  const header=document.createElement('div');header.className='content-head';header.innerHTML=`<div><strong></strong><div class="content-meta"></div></div><div class="doc-actions"><button class="secondary" id="openPdf">PDF Preview</button></div>`;header.querySelector('strong').textContent=subject.title;header.querySelector('.content-meta').textContent=`${subject.pageCount} pages · validation score ${subject.score}`;header.querySelector('#openPdf').onclick=()=>window.open(subject.pdfUrl,'_blank');root.appendChild(header);
  const pages=document.createElement('div');pages.className='pages';root.appendChild(pages);
  if(!subject.document.pages||!subject.document.pages.length){root.innerHTML='<div class="content-error">The parser returned no pages.</div>';return}
  requestAnimationFrame(()=>subject.document.pages.forEach(pageData=>pages.appendChild(renderPage(pageData,subject))));
}

function renderPage(data,subject){
  const shell=document.createElement('article');shell.className='page-shell';const label=document.createElement('div');label.className='page-label';label.textContent='Page '+data.number;const page=document.createElement('div');page.className='pdf-page';
  const available=Math.max(320,Math.min(900,document.getElementById('content').clientWidth-100));const scale=available/data.width;page.style.width=(data.width*scale)+'px';page.style.height=(data.height*scale)+'px';
  (data.images||[]).forEach(image=>{const b=image.bbox,img=document.createElement('img');img.src=`/data/${subject.id}/${image.url}`;Object.assign(img.style,{left:b[0]*scale+'px',top:b[1]*scale+'px',width:(b[2]-b[0])*scale+'px',height:(b[3]-b[1])*scale+'px'});page.appendChild(img)});
  (data.blocks||[]).forEach(block=>(block.lines||[]).forEach(line=>(line.runs||[]).forEach(run=>page.appendChild(renderRun(run,scale)))));
  shell.append(label,page);return shell;
}
function renderRun(run,scale){const span=document.createElement('span');span.textContent=run.text;const b=run.bbox||[0,0,0,0];Object.assign(span.style,{left:(b[0]*scale)+'px',top:(b[1]*scale)+'px',fontFamily:`"${run.font_family||'sans-serif'}",sans-serif`,fontSize:((run.size||12)*scale)+'px',fontWeight:run.bold?'700':'400',fontStyle:run.italic?'italic':'normal',color:run.color||'#000'});if(run.superscript)span.style.transform='translateY(-18%) scale(.84)';return span}

document.querySelectorAll('.mode').forEach(button=>button.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));button.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(button.dataset.view).classList.add('active')});
function applyZoom(){const node=document.querySelector('.map-node');node.style.transform=`translate(-50%,-50%) scale(${zoomValue/100})`;document.getElementById('zoomLevel').textContent=zoomValue+'%'}document.getElementById('zoomIn').onclick=()=>{zoomValue=Math.min(200,zoomValue+10);applyZoom()};document.getElementById('zoomOut').onclick=()=>{zoomValue=Math.max(40,zoomValue-10);applyZoom()};document.getElementById('zoomLevel').onclick=()=>{zoomValue=100;applyZoom()};
</script>
</body></html>
